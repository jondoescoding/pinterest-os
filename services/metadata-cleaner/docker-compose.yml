services:
  metadata-cleaner:
    build: .
    container_name: pinterest-os-metadata-cleaner
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8791:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
